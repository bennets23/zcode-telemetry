<!doctype html>
<html lang="en" data-host-theme="dark" data-hud-theme="mono">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZCode Telemetry HUD</title>
    <style>
      :root {
        --bg: #0e0f10;
        --bg-elev: #15171a;
        --line: rgba(255, 255, 255, 0.11);
        --line-strong: rgba(255, 255, 255, 0.24);
        --ink: #e5e7eb;
        --muted: #8b9099;
        --dim: #575c65;
        --warn: #d49b4b;
        --alert: #d46a6a;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      html[data-host-theme="light"][data-hud-theme="mono"] {
        --bg: #f4f4f1;
        --bg-elev: #eaeae5;
        --line: rgba(15, 17, 20, 0.12);
        --line-strong: rgba(15, 17, 20, 0.28);
        --ink: #17191c;
        --muted: #575c66;
        --dim: #808691;
        --warn: #b46914;
        --alert: #b93838;
      }

      html[data-hud-theme="amber"] {
        --bg: #100d09;
        --bg-elev: #18130d;
        --line: rgba(216, 157, 76, 0.18);
        --line-strong: rgba(216, 157, 76, 0.4);
        --ink: #d89d4c;
        --muted: #9b733b;
        --dim: #634925;
        --warn: #eab354;
        --alert: #df6b57;
      }

      html[data-hud-theme="crt"] {
        --bg: #090d0a;
        --bg-elev: #0f1611;
        --line: rgba(120, 190, 123, 0.18);
        --line-strong: rgba(120, 190, 123, 0.4);
        --ink: #78be7b;
        --muted: #518654;
        --dim: #325434;
        --warn: #d49b4b;
        --alert: #d46a6a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      .hud {
        width: 100%;
        max-width: 820px;
        margin: 0 auto;
        padding: 8px 10px 14px;
        display: flex;
        flex-direction: column;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }

      .bar-left {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--dim);
        flex-shrink: 0;
      }

      .dot.live {
        background: var(--ink);
        animation: blink 1.1s steps(2, start) infinite;
      }

      .dot.active {
        background: var(--muted);
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }

      .badge {
        font-size: 10px;
        padding: 1px 5px;
        border: 1px solid var(--line-strong);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .badge.live {
        color: var(--ink);
        border-color: var(--ink);
      }

      .badge.warn {
        color: var(--warn);
        border-color: var(--warn);
      }

      .model-name {
        font-size: 10px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 165px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }

      button,
      select {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        padding: 2px 6px;
        cursor: pointer;
        text-transform: uppercase;
      }

      button:hover,
      select:hover {
        color: var(--ink);
        border-color: var(--line-strong);
      }

      button.active {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
        font-weight: 700;
      }

      .grant-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 8px;
        margin-top: 8px;
        border: 1px solid var(--warn);
        color: var(--warn);
        font-size: 10px;
      }

      .grant-bar[hidden] {
        display: none;
      }

      .grant-bar button {
        border-color: var(--warn);
        color: var(--warn);
        flex-shrink: 0;
      }

      .section {
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .section:last-child {
        border-bottom: 0;
      }

      .sec-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .sec-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .sec-meta {
        font-size: 10px;
        color: var(--muted);
      }

      .speed-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }

      .speed-hero {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      .speed-unit {
        font-size: 11px;
        color: var(--muted);
        margin-left: 3px;
        font-weight: 400;
      }

      .inline-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 10px;
        color: var(--muted);
      }

      .inline-stats b {
        color: var(--ink);
        font-weight: 600;
      }

      .spark {
        width: 100%;
        height: 44px;
        border: 1px solid var(--line);
        background: var(--bg-elev);
      }

      .spark svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .meter {
        width: 100%;
        height: 7px;
        display: flex;
        background: var(--bg-elev);
        border: 1px solid var(--line);
        overflow: hidden;
      }

      .seg {
        height: 100%;
        background: var(--ink);
        transition: width 160ms ease;
      }

      .cat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 2px 14px;
      }

      .cat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: 10px;
      }

      .cat-left {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        color: var(--muted);
      }

      .cat-swatch {
        width: 6px;
        height: 6px;
        background: var(--ink);
        flex-shrink: 0;
      }

      .cat-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cat-val {
        color: var(--ink);
        white-space: nowrap;
      }

      .sub-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .sub-item {
        padding: 4px 6px;
        background: var(--bg-elev);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .sub-item.running {
        border-color: var(--line-strong);
      }

      .sub-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .sub-title-wrap {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }

      .sub-state {
        font-size: 9px;
        padding: 0 4px;
        border: 1px solid var(--line);
        color: var(--muted);
        flex-shrink: 0;
      }

      .sub-state.run {
        border-color: var(--ink);
        color: var(--ink);
      }

      .sub-state.err {
        border-color: var(--alert);
        color: var(--alert);
      }

      .sub-type {
        font-size: 9px;
        color: var(--muted);
        flex-shrink: 0;
      }

      .sub-title {
        font-size: 10px;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sub-time {
        font-size: 10px;
        color: var(--muted);
        flex-shrink: 0;
      }

      .sub-meta {
        font-size: 10px;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
      }

      .kv-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
        gap: 6px;
      }

      .kv {
        padding: 4px 6px;
        border: 1px solid var(--line);
        background: var(--bg-elev);
      }

      .kv[hidden] {
        display: none;
      }

      .kv-k {
        font-size: 9px;
        color: var(--dim);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .kv-v {
        font-size: 11px;
        font-weight: 600;
        color: var(--ink);
      }

      .notice {
        font-size: 10px;
        padding: 4px 6px;
        border: 1px solid var(--warn);
        color: var(--warn);
      }

      .table-wrap {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
      }

      th {
        text-align: left;
        font-size: 9px;
        letter-spacing: 0.06em;
        color: var(--dim);
        border-bottom: 1px solid var(--line);
        padding: 3px 6px 3px 0;
        text-transform: uppercase;
        font-weight: 600;
      }

      td {
        padding: 3px 6px 3px 0;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        color: var(--ink);
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .num {
        text-align: right;
      }

      .cfg-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .btn-group {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex-wrap: wrap;
      }

      .warn { color: var(--warn); }
      .alert { color: var(--alert); }
      .muted { color: var(--muted); }
      .empty { font-size: 10px; color: var(--dim); }
    </style>
  </head>
  <body>
    <main class="hud">
      <header class="bar">
        <div class="bar-left">
          <span id="dot" class="dot"></span>
          <span id="state-badge" class="badge">IDLE</span>
          <span id="model-name" class="model-name">--</span>
        </div>
        <div class="actions">
          <select id="session-select" title="Session" hidden></select>
          <button id="btn-view-mode" type="button">+ FULL</button>
          <button id="btn-theme" type="button">MONO</button>
          <button id="btn-copy" type="button">COPY</button>
          <button id="btn-refresh" type="button" title="Refresh">R</button>
        </div>
      </header>

      <div id="grant-bar" class="grant-bar" hidden>
        <span>LIVE EDIT T/S + 0 T/S IDLE REQUIRE SESSIONS.READ</span>
        <button id="btn-grant" type="button">GRANT</button>
      </div>

      <section class="section">
        <div class="sec-head">
          <span class="sec-title">THROUGHPUT</span>
          <span id="req-meta" class="sec-meta">--</span>
        </div>
        <div class="speed-row">
          <div>
            <span id="hero-tps" class="speed-hero">0.0</span><span class="speed-unit">t/s</span>
          </div>
          <div class="inline-stats">
            <span>last <b id="stat-last">--</b></span>
            <span>med <b id="stat-med">--</b></span>
            <span>peak <b id="stat-peak">--</b></span>
            <span>ttft <b id="stat-ttft">--</b></span>
            <span>out <b id="stat-out">--</b></span>
          </div>
        </div>
        <div class="spark" id="spark"></div>
      </section>

      <section class="section">
        <div class="sec-head">
          <span class="sec-title">CONTEXT</span>
          <span id="ctx-head" class="sec-meta">--</span>
        </div>
        <div class="meter" id="ctx-meter"></div>
        <div class="cat-grid" id="ctx-cats"></div>
        <div id="ctx-runway" class="sec-meta" hidden></div>
      </section>

      <section class="section">
        <div class="sec-head">
          <span class="sec-title">SUBAGENTS</span>
          <span id="sub-head" class="sec-meta">NONE</span>
        </div>
        <div id="sub-list" class="sub-list"></div>
      </section>

      <div id="full-sections" hidden>
        <section class="section">
          <div class="sec-head">
            <span class="sec-title">TOKENS &amp; CACHE</span>
            <span id="cache-head" class="sec-meta">--</span>
          </div>
          <div class="kv-grid">
            <div class="kv"><div class="kv-k">FRESH IN</div><div id="kv-fresh" class="kv-v">--</div></div>
            <div class="kv"><div class="kv-k">CACHE READ</div><div id="kv-cache" class="kv-v">--</div></div>
            <div class="kv" id="kv-cw-wrap" hidden><div class="kv-k">CACHE WRITE</div><div id="kv-cw" class="kv-v">--</div></div>
            <div class="kv"><div class="kv-k">OUTPUT</div><div id="kv-out" class="kv-v">--</div></div>
            <div class="kv"><div class="kv-k">REASONING</div><div id="kv-reas" class="kv-v">--</div></div>
          </div>
          <div id="sub-summary-line" class="sec-meta"></div>
        </section>

        <section class="section">
          <div class="sec-head">
            <span class="sec-title">TURN BUDGET &amp; TOOLS</span>
            <span id="turn-head" class="sec-meta">--</span>
          </div>
          <div class="meter" id="budget-meter"></div>
          <div id="budget-line" class="inline-stats"></div>
          <div id="retry-notice" class="notice" hidden></div>
          <div class="table-wrap" id="tools-table"></div>
        </section>

        <section class="section">
          <div class="sec-head">
            <span class="sec-title">BENCHMARKS</span>
            <div class="btn-group">
              <button type="button" data-range="session">SESS</button>
              <button type="button" data-range="today">DAY</button>
              <button type="button" data-range="7d">7D</button>
              <button type="button" data-range="all">ALL</button>
            </div>
          </div>
          <div class="table-wrap" id="bench-table"></div>
        </section>

        <section class="section">
          <div class="sec-head">
            <span class="sec-title">HUD CONTROLS</span>
          </div>
          <div class="cfg-row">
            <div class="btn-group">
              <button id="btn-smooth" type="button">EMA: ON</button>
              <button id="btn-pill-mode" type="button">PILL: COMPACT</button>
              <button id="btn-pill-click" type="button">CLICK: HUD</button>
              <button id="btn-pill-vis" type="button">PILL: ON</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        const RESOURCE_URI = "telemetry://snapshot";
        const PILL_MODES = ["compact", "detailed", "minimal"];
        const THEMES = ["mono", "amber", "crt"];
        const STEP_OPACITIES = [0.95, 0.68, 0.48, 0.34, 0.24, 0.16, 0.11];

        const isEmbedded = window.parent && window.parent !== window;
        let nextRpcId = 1;
        const pendingRpc = new Map();
        let currentSnapshot = null;
        let selectedSessionId = null;
        let pinnedSessionId = null;
        let currentRange = "today";

        const el = (id) => document.getElementById(id);

        function escapeHtml(value) {
          return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function fmtTokens(n) {
          if (typeof n !== "number" || !Number.isFinite(n) || n < 0) return "--";
          if (n < 1000) return String(Math.round(n));
          if (n < 100000) return `${(n / 1000).toFixed(1)}K`;
          if (n < 1000000) return `${Math.round(n / 1000)}K`;
          return `${(n / 1000000).toFixed(2)}M`;
        }

        function fmtBytes(n) {
          if (typeof n !== "number" || !Number.isFinite(n) || n < 0) return "--";
          if (n < 1024) return `${Math.round(n)}B`;
          if (n < 1024 * 100) return `${(n / 1024).toFixed(1)}K`;
          if (n < 1024 * 1024) return `${Math.round(n / 1024)}K`;
          return `${(n / (1024 * 1024)).toFixed(1)}M`;
        }

        function fmtDuration(ms) {
          if (typeof ms !== "number" || !Number.isFinite(ms) || ms < 0) return "--";
          if (ms < 1000) return `${Math.round(ms)}ms`;
          if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
          const totalSec = Math.round(ms / 1000);
          return `${Math.floor(totalSec / 60)}m ${totalSec % 60}s`;
        }

        function fmtTps(tps) {
          if (typeof tps !== "number" || !Number.isFinite(tps) || tps < 0) return "--";
          return tps >= 1000 ? String(Math.round(tps)) : tps.toFixed(1);
        }

        function applyHostContext(hostCtx) {
          if (!hostCtx || typeof hostCtx !== "object") return;
          if (hostCtx.theme === "light" || hostCtx.theme === "dark") {
            document.documentElement.setAttribute("data-host-theme", hostCtx.theme);
          }
        }

        function sendRpcRequest(method, params) {
          if (!isEmbedded) {
            return Promise.reject(new Error("Standalone preview mode"));
          }
          const id = nextRpcId++;
          return new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
              pendingRpc.delete(id);
              reject(new Error(`RPC timeout: ${method}`));
            }, 6000);
            pendingRpc.set(id, { resolve, reject, timeout });
            window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
          });
        }

        function sendRpcNotification(method, params) {
          if (!isEmbedded) return;
          window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
        }

        function parseToolResult(res) {
          if (res?.structuredContent && typeof res.structuredContent === "object") {
            return res.structuredContent;
          }
          const text = res?.content?.[0]?.text;
          if (typeof text === "string") {
            return JSON.parse(text);
          }
          return null;
        }

        async function fetchSnapshot(forceSqlite = false) {
          if (!isEmbedded) {
            render(createPreviewSnapshot());
            return;
          }
          const targetId = pinnedSessionId || selectedSessionId;
          const res = await sendRpcRequest("tools/call", {
            name: "get_snapshot",
            arguments: {
              ...(targetId ? { sessionId: targetId } : {}),
              range: currentRange,
              forceSqlite,
            },
          });
          const data = parseToolResult(res);
          if (data) render(data);
        }

        async function readResourceSnapshot() {
          if (!isEmbedded) return;
          const res = await sendRpcRequest("resources/read", { uri: RESOURCE_URI });
          const text = res?.contents?.[0]?.text;
          if (typeof text === "string") {
            render(JSON.parse(text));
          }
        }

        async function updatePrefs(patch) {
          if (!isEmbedded) {
            const next = {
              ...currentSnapshot,
              prefs: { ...currentSnapshot.prefs, ...patch },
              ...(patch.range ? { range: patch.range } : {}),
            };
            render(next);
            return;
          }
          const res = await sendRpcRequest("tools/call", {
            name: "set_preferences",
            arguments: patch,
          });
          const data = parseToolResult(res);
          if (data) {
            if (pinnedSessionId && data.sessionId !== pinnedSessionId) {
              await fetchSnapshot(true);
            } else {
              render(data);
            }
          }
        }

        function renderMeter(container, segments) {
          container.innerHTML = "";
          for (const seg of segments) {
            if (!seg.pct || seg.pct <= 0) continue;
            const div = document.createElement("div");
            div.className = "seg";
            div.style.width = `${Math.max(0.4, seg.pct)}%`;
            div.style.opacity = String(seg.opacity ?? 1);
            if (seg.warn) div.style.background = "var(--warn)";
            if (seg.alert) div.style.background = "var(--alert)";
            if (seg.title) div.title = seg.title;
            container.appendChild(div);
          }
        }

        function renderSparkline(container, history, medianVal) {
          const pts = (history || []).filter((item) => typeof item.tps === "number" && item.tps > 0);
          if (pts.length === 0) {
            container.innerHTML = `<svg viewBox="0 0 320 44" preserveAspectRatio="none"><text x="8" y="25" fill="currentColor" opacity="0.4" font-size="9" font-family="monospace">AWAITING STREAM SAMPLES</text></svg>`;
            return;
          }
          const w = 320;
          const h = 44;
          const padX = 5;
          const padY = 6;
          const values = pts.map((p) => p.tps);
          const min = Math.min(...values) * 0.85;
          const max = Math.max(...values, min + 10);
          const span = Math.max(1, max - min);

          const toY = (val) => h - padY - ((val - min) / span) * (h - padY * 2);
          const coords = pts.map((p, idx) => {
            const x = pts.length === 1 ? w - padX : padX + (idx / (pts.length - 1)) * (w - padX * 2);
            return [x, toY(p.tps)];
          });

          const poly = coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
          const area = `${coords[0][0].toFixed(1)},${h} ${poly} ${coords[coords.length - 1][0].toFixed(1)},${h}`;
          const last = coords[coords.length - 1];
          const medLine = typeof medianVal === "number" && medianVal > 0
            ? `<line x1="0" y1="${toY(medianVal).toFixed(1)}" x2="${w}" y2="${toY(medianVal).toFixed(1)}" stroke="currentColor" stroke-opacity="0.22" stroke-dasharray="2,3" />`
            : "";

          container.innerHTML = `
            <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Throughput trace">
              <defs>
                <linearGradient id="monoFill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="currentColor" stop-opacity="0.16" />

        function render(snapshot) {
          currentSnapshot = snapshot;
          const prefs = snapshot.prefs || {};
          currentRange = snapshot.range || prefs.range || "today";

          const visSessions = snapshot.visibleSessions || [];
          if (pinnedSessionId && !visSessions.some((s) => s.sessionId === pinnedSessionId)) {
            pinnedSessionId = null;
          }
          selectedSessionId = pinnedSessionId || snapshot.sessionId || null;

          const hudTheme = THEMES.includes(prefs.theme) ? prefs.theme : "mono";
          document.documentElement.setAttribute("data-hud-theme", hudTheme);
          el("btn-theme").textContent = hudTheme.toUpperCase();

          const isFull = prefs.viewMode === "full";
          el("full-sections").hidden = !isFull;
          el("btn-view-mode").textContent = isFull ? "- COMPACT" : "+ FULL";
          el("btn-view-mode").classList.toggle("active", isFull);

          for (const btn of document.querySelectorAll("[data-range]")) {

          el("btn-pill-vis").textContent = `PILL: ${prefs.pillVisible !== false ? "ON" : "OFF"}`;
          el("btn-pill-vis").classList.toggle("active", prefs.pillVisible !== false);

          el("grant-bar").hidden = snapshot.permissions?.sessionsRead !== false;

          const sessSelect = el("session-select");
          if (visSessions.length > 1) {
            sessSelect.hidden = false;
            sessSelect.innerHTML = visSessions
              .map((s) => `<option value="${escapeHtml(s.sessionId)}" ${s.sessionId === selectedSessionId ? "selected" : ""}>${escapeHtml(s.sessionId.slice(0, 12))}</option>`)
              .join("");
          } else {
            sessSelect.hidden = true;
          }

          const tp = snapshot.throughput || {};
          const liveSess = snapshot.live || null;
          const ctx = snapshot.context || null;
          const sess = snapshot.sqlite?.session || null;
          const turn = snapshot.sqlite?.turnProfile || null;
          const subagents = snapshot.sqlite?.subagents || null;
          const benchmarks = snapshot.sqlite?.benchmarks || [];

          const isStreaming = tp.phase === "streaming";
          const isIdle = liveSess?.isIdle === true || (tp.phase === "idle" && !liveSess?.isActiveTurn);
          const isStalled = Boolean(liveSess?.isActiveTurn && liveSess?.stalledWaitMs >= 8000 && !isStreaming);
          const lastTps = tp.lastValidTps ?? tp.rawTps ?? sess?.latest?.tps ?? null;

          let displayTps;
          if (isStreaming) {
            displayTps = prefs.smoothing !== false ? (tp.emaTps ?? tp.rawTps) : tp.rawTps;
          } else if (isIdle) {
            displayTps = 0;
          } else {
            displayTps = tp.rawTps ?? sess?.latest?.tps ?? 0;
          }

          el("dot").className = `dot ${isStreaming ? "live" : (liveSess?.isActiveTurn ? "active" : "")}`;

          const badge = el("state-badge");
          if (isStalled) {
            badge.textContent = `WAIT ${Math.round(liveSess.stalledWaitMs / 1000)}S`;
            badge.className = "badge warn";
          } else if (liveSess?.isActiveTurn && liveSess.activity?.kind && liveSess.activity.kind !== "idle") {
            badge.textContent = liveSess.activity.label;
            badge.className = `badge ${isStreaming ? "live" : ""}`;
          } else {
            badge.textContent = isStreaming ? "LIVE" : "IDLE";

            const cats = ctx.categories || [];

            const denom = Math.max(1, budget.ttftMs + budget.decodeMs + budget.toolMs + budget.retryWaitMs);
            const parts = [
              { label: "DECODE", ms: budget.decodeMs, opacity: 0.95 },

            renderMeter(

              parts.map((p) => ({

            el("budget-line").innerHTML = parts

                <tbody>${benchmarks
                  .map((b) => {

                    return `<tr><td>${escapeHtml(b.modelId)}</td><td class="num">${b.requestCount}</td><td class="num">${fmtTps(b.medianTps)}</td><td class="num">${fmtDuration(p50)}</td><td class="num">${fmtDuration(b.p95TtftMs)}</td><td class="num ${errCls}">${errPct.toFixed(0)}%</td><td class="num">${b.cacheHitPct.toFixed(0)}%</td><td class="num">${fmtTokens(b.outputTokens)}</td></tr>`;
                  })
                  .join("")}</tbody>
              </table>`
            : `<div class="empty">No model data in range.</div>`;

          const msg = ev.data;

          if (Object.hasOwn(msg, "id") && pendingRpc.has(msg.id)) {
            const entry = pendingRpc.get(msg.id);
            pendingRpc.delete(msg.id);
            clearTimeout(entry.timeout);
            if (msg.error) entry.reject(new Error(msg.error.message || "RPC error"));
            else entry.resolve(msg.result);
            return;
          }

          if (msg.method === "ui/notifications/host-context-changed") {
            applyHostContext(msg.params);
          } else if (msg.method === "notifications/resources/updated" && msg.params?.uri === RESOURCE_URI) {
            if (!refreshPending) {
              refreshPending = true;
              queueMicrotask(async () => {
                refreshPending = false;

            applyHostContext(initRes?.hostContext);
            sendRpcNotification("ui/notifications/initialized", {});
            await sendRpcRequest("resources/subscribe", { uri: RESOURCE_URI });
            await fetchSnapshot(true);
          } catch (err) {
            el("model-name").textContent = err instanceof Error ? err.message : String(err);
          }
        }

        void bootstrap();
      })();
    </script>
  </body>
</html>
